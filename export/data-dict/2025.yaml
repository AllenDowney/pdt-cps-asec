name: cps-asec
label: Current Population Survey, Annual Social and Economic Supplement (CPS ASEC)
description: 'The March supplement to the monthly Current Population Survey, conducted by the Census Bureau
  for the Bureau of Labor Statistics: income, poverty, work experience, health insurance and living arrangements
  of the US civilian noninstitutional population.'
details: |
  Publisher: U.S. Census Bureau (for the Bureau of Labor Statistics) (https://www.census.gov/)

  Release `2025`: CPS ASEC 2025 public-use file (income in 2024) (current)

  Terms of use: https://www.census.gov/about/policies.html

  Citation: U.S. Census Bureau and U.S. Bureau of Labor Statistics, Current Population Survey, Annual Social and Economic Supplement (CPS ASEC), public-use file, <year>, <https://www.census.gov/data/datasets/time-series/demo/cps/cps-asec.html>, accessed on <date>.

  Exported by the PublicDataToolkit library 0.1.0 from this repository's records (`metadata/`), which are canonical and hold what data-dict can't: missing-code types, availability, wording by wave, corrections, provenance, groups and links. See LOSSES.md.
